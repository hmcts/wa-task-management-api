apiVersion: v2
appVersion: "1.0"
description: A Helm chart for wa-task-management-api App
name: wa-task-management-api
home: https://github.com/hmcts/wa-task-management-api
version: 0.1.7
maintainers:
  - name: HMCTS wa team
dependencies:
  - name: java
    version: 6.1.1
    repository: 'oci://hmctsprod.azurecr.io/helm'
  - name: camunda-bpm
    version: 0.0.52
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: camunda-bpm.enabled
  - name: wa-workflow-api
    version: 0.1.6
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: wa-workflow-api.enabled

