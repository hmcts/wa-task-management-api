java:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  releaseNameOverride: "{{ .Release.Name }}-java"
  keyVaults:
    wa:
      secrets:
        - name: AppInsightsInstrumentationKey
          alias: azure.application-insights.instrumentation-key
        - name: wa-system-username
          alias: WA_SYSTEM_USERNAME
        - name: probate-search-email
          alias: PROBATE_SEARCH_EMAIL
        - name: wa-system-password
          alias: WA_SYSTEM_PASSWORD
        - name: wa-idam-client-secret
          alias: WA_IDAM_CLIENT_SECRET
        - name: s2s-secret-task-management-api
          alias: S2S_SECRET_TASK_MANAGEMENT_API
        - name: ld-secret
          alias: LAUNCH_DARKLY_SDK_KEY
  environment:
    CAMUNDA_URL: "http://{{ .Release.Name }}-camunda/engine-rest"
    IDAM_URL: "https://idam-api.{{ .Values.global.environment }}.platform.hmcts.net"
    S2S_URL: "http://rpe-service-auth-provider-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal"
    OPEN_ID_IDAM_URL: "https://idam-web-public.{{ .Values.global.environment }}.platform.hmcts.net"
    IDAM_SECURITY_ALLOWED_ISSUER_0: "https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/realms/root/realms/hmcts"
    IDAM_SECURITY_ALLOWED_ISSUER_1: "https://hmcts-access.aat.platform.hmcts.net/o"
    IDAM_SECURITY_ALLOWED_ISSUER_2: "https://idam-web-public.aat.platform.hmcts.net/o"
    ROLE_ASSIGNMENT_URL: "http://am-role-assignment-service-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal"
    POSTGRES_HOST: "{{ .Release.Name }}-postgresql"
    POSTGRES_REPLICA_HOST: "{{ .Release.Name }}-postgresql"
    POSTGRES_REPLICA_PORT: 5432
    POSTGRES_NAME: "{{ .Values.postgresql.auth.database}}"
    POSTGRES_REPLICA_NAME: "cft_task_db_replica"
    POSTGRES_USERNAME: "{{ .Values.postgresql.auth.username}}"
    POSTGRES_PASSWORD: "{{ .Values.postgresql.auth.password}}"
    REPLICATION_USERNAME: "{{ .Values.postgresql.auth.username}}"
    REPLICATION_PASSWORD: "{{ .Values.postgresql.auth.password}}"
    POSTGRES_CONNECTION_OPTIONS: ""
    SPRING_PROFILES_ACTIVE: "preview,replica"
    DB_READER_USERNAME: "{{ .Values.postgresql.auth.username}}"
    MANDATORY_TASK_FIELD_CHECK_ENABLED: true
  postgresql:
    enabled: true
    auth:
      database: cft_task_db
      username: javapostgres
      password: ${GENERIC_HMCTS_YAML_PASS}
      postgresPassword: ${GENERIC_HMCTS_YAML_PASS}
    primary:
      persistence:
        enabled: false
      podAnnotations:
        wa-preview-database-layout: "tm-camunda-workflow-v1"
      extraEnvVars:
        - name: POSTGRESQL_WAL_LEVEL
          value: "logical"
      resources:
        requests:
          cpu: 25m
      initdb:
        user: postgres
        scripts:
          init.sql: |
            ALTER ROLE javapostgres WITH SUPERUSER;
            CREATE DATABASE "cft_task_db_replica" WITH OWNER = javapostgres ENCODING = 'UTF-8' CONNECTION LIMIT = -1;
            CREATE DATABASE "camunda" WITH OWNER = javapostgres ENCODING = 'UTF-8' CONNECTION LIMIT = -1;
            CREATE DATABASE "wa_workflow_api" WITH OWNER = javapostgres ENCODING = 'UTF-8' CONNECTION LIMIT = -1;

camunda-bpm:
  enabled: true
  java:
    releaseNameOverride: "{{ .Release.Name }}-camunda"
    ingressHost: "camunda-{{ .Release.Name }}.preview.platform.hmcts.net"
    disableKeyVaults: true
    environment:
      CAMUNDA_DB_HOST: "{{ .Release.Name }}-postgresql"
      CAMUNDA_DB_NAME: camunda
      CAMUNDA_DB_USER_NAME: javapostgres
      CAMUNDA_DB_PASSWORD: ${GENERIC_HMCTS_YAML_PASS}
      CAMUNDA_DB_CONN_OPTIONS: ""
      CAMUNDA_BPM_DATABASE_SCHEMAUPDATE: true
      CAMUNDA_API_AUTH_ENABLED: true
      TASK_MANAGEMENT_API_URL: "http://{{ .Release.Name }}-java"
      WA_INITIATE_TASKS_ON_CREATE_ENABLED: true
      S2S_URL: "http://rpe-service-auth-provider-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal"
      S2S_SECRET_CAMUNDA_BPM: ${S2S_SECRET_CAMUNDA_BPM}

wa-workflow-api:
  enabled: true
  wa:
    enabled: false
  camunda-bpm:
    enabled: false
  java:
    releaseNameOverride: "{{ .Release.Name }}-workflow"
    ingressHost: "workflow-{{ .Release.Name }}.preview.platform.hmcts.net"
    disableKeyVaults: true
    autoscaling:
      enabled: false
    environment:
      CAMUNDA_URL: "http://{{ .Release.Name }}-camunda/engine-rest"
      WA_TASK_MANAGEMENT_API_URL: "http://{{ .Release.Name }}-java"
      S2S_URL: "http://rpe-service-auth-provider-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal"
      S2S_SECRET_WORKFLOW_API: ${S2S_SECRET_WORKFLOW_API}
      POSTGRES_HOST: "{{ .Release.Name }}-postgresql"
      POSTGRES_NAME: wa_workflow_api
      POSTGRES_USERNAME: javapostgres
      POSTGRES_PASSWORD: ${GENERIC_HMCTS_YAML_PASS}
      POSTGRES_CONNECTION_OPTIONS: ""
      DB_READER_USERNAME: javapostgres
      LAUNCH_DARKLY_SDK_KEY: ${LAUNCH_DARKLY_SDK_KEY}
      ENVIRONMENT: preview
