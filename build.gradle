// Keep the shared-library entry point; publication depends on successful generation.
task runAndPublishConsumerPactTests {
  description = 'Runs the full consumer Pact suite and publishes its contracts'
  group = 'Verification'
  dependsOn 'pactPublish'
}

pact {
  broker {
    pactBrokerUrl = System.getenv("PACT_BROKER_FULL_URL") ?: 'http://localhost:9292'
  }
  publish {
    pactBrokerUrl = System.getenv("PACT_BROKER_FULL_URL") ?: 'http://localhost:9292'
    pactDirectory = 'build/pacts'
    version = project.pacticipantVersion
    consumerVersion = project.pacticipantVersion
    consumerBranch = project.pacticipantBranch
    consumerBuildUrl = System.getenv('BUILD_URL')
  }
}

tasks.named('pactPublish') { publishTask ->
  pactPublish = project.pact.publish
  dependsOn 'contract'
  doFirst {
    def configuration = publishTask.pactPublish.get()
    // The plugin prefers the broker block over the publish block when present.
    def effectiveBroker = publishTask.broker.getOrNull() ?: configuration
    if (!isPactPublishingAllowed(effectiveBroker.pactBrokerUrl)) {
      throw new GradleException('Pact publication to the primary Pact Broker is restricted to the CI pipeline only. ' +
        'Use a local Broker on localhost port 9292 for local publication.')
    }
    validatePactPublicationMetadata(configuration.consumerVersion.toString(),
      configuration.consumerBranch, pactInput('pact.consumer.version'))
    def consumerTests = tasks.named('contract', Test).get()
    if (!consumerTests.state.executed || consumerTests.state.skipped ||
        !consumerTests.filter.commandLineIncludePatterns.empty) {
      throw new GradleException('Publication requires the full consumer Pact suite; skipped or filtered runs cannot publish.')
    }
    def pactFiles = fileTree(configuration.pactDirectory).matching { include '*.json' }.files
    if (pactFiles.empty) {
      throw new GradleException('No fresh consumer Pacts were generated; nothing will be published.')
    }
  }
}

task contract(type: Test) {
  description = "Runs the consumer Pact tests"
  group = 'Verification'
  useJUnitPlatform()
  testClassesDirs = sourceSets.contractTest.output.classesDirs
  classpath = sourceSets.contractTest.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED']
  // All 24 Pact-producing classes are under a consumer package, including task configuration.
  include '**/consumer/**'
  systemProperty 'pact.rootDir', file('build/pacts').absolutePath
  outputs.dir layout.buildDirectory.dir('pacts')
  outputs.upToDateWhen { false }
  outputs.doNotCacheIf('Consumer Pacts must be generated by this test run') { true }
  doFirst {
    delete layout.buildDirectory.dir('pacts')
  }
}

task runProviderPactVerification(type: Test) {
  logger.lifecycle("Runs provider pact Tests")
  testClassesDirs = sourceSets.contractTest.output.classesDirs
  classpath = sourceSets.contractTest.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED']
  include '**/provider/**'
  reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/contractTest')
}

task fortifyScan(type: JavaExec)  {
  mainClass = "uk.gov.hmcts.fortifyclient.FortifyClientMainApp"
  classpath += sourceSets.test.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}

runProviderPactVerification.dependsOn contract

runProviderPactVerification.finalizedBy pactVerify

// Keep the result-publication policy scoped to the provider verification entry point.
tasks.named('runProviderPactVerification', Test) { verificationTask ->
  systemProperty 'pact.verifier.publishResults', pactInput('pact.verifier.publishResults', 'false')
  systemProperty 'pact.provider.version', project.pacticipantVersion
  systemProperty 'pact.provider.branch', pactInput('pact.provider.branch', project.pacticipantBranch)
  systemProperty 'pactbroker.enablePending', pactInput('pactbroker.enablePending', 'false')
  doFirst {
    if (verificationTask.systemProperties['pact.verifier.publishResults'].toString().toBoolean()) {
      def brokerUrl = verificationTask.systemProperties['PACT_BROKER_FULL_URL'] ?:
        verificationTask.environment['PACT_BROKER_FULL_URL'] ?: 'http://localhost:9292'
      if (!isPactPublishingAllowed(brokerUrl.toString())) {
        throw new GradleException('Publishing provider verification results to a remote Broker is restricted to Jenkins.')
      }
      validatePactPublicationMetadata(verificationTask.systemProperties['pact.provider.version'].toString(),
        verificationTask.systemProperties['pact.provider.branch'].toString(), pactInput('pact.provider.version'))
    }
  }
}

// Temporary accident-prevention policy; replace with centrally enforced Broker authorisation.
boolean isPactPublishingAllowed(String brokerUrl, Map environment = System.getenv()) {
  if (!brokerUrl?.trim()) {
    return false
  }
  URI broker
  try {
    broker = new URI(brokerUrl)
  } catch (IllegalArgumentException | URISyntaxException ignored) {
    return false
  }
  if (!(broker.scheme in ['http', 'https']) || !broker.host || broker.userInfo || broker.query || broker.fragment) {
    return false
  }
  def runningInJenkins = ['BUILD_URL', 'JOB_NAME', 'BUILD_NUMBER'].every { environment[it]?.trim() }
  def localBroker = broker.scheme == 'http' && broker.host in ['localhost', '127.0.0.1'] &&
    broker.port == 9292 && broker.path in ['', '/']
  return runningInJenkins || localBroker
}

String pactInput(String name, String fallback = '') {
  def value = project.findProperty(name)
  return value != null ? value.toString() : System.getProperty(name, fallback)
}

void validatePactPublicationMetadata(String version, String branch, String requestedVersion) {
  if (!(version ==~ /[0-9a-f]{40}/) || !branch?.trim()) {
    throw new GradleException('Pact publication requires the full checked-out Git SHA and explicit branch metadata.')
  }
  // Accept the existing library's short SHA only when it identifies this same commit.
  if (requestedVersion && (!(requestedVersion ==~ /[0-9a-f]{7,40}/) || !version.startsWith(requestedVersion))) {
    throw new GradleException('The CI Pact version input does not match the checked-out Git commit.')
  }
}

def getCheckedOutGitCommitHash() {
  providers.exec {
    commandLine 'git', 'rev-parse', '--verify', 'HEAD'
    // Jenkins stages may not have a checked-out HEAD.
    ignoreExitValue = true
  }.standardOutput.asText.map { it.trim() }.get()
}

application {
