plugins {
  id 'idea'
  id 'application'
  id 'checkstyle'
  id 'pmd'
  id 'jacoco'
  id 'uk.gov.hmcts.java' version '0.12.70'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.1.1'
  id 'org.owasp.dependencycheck' version '13.0.0'
  id 'io.github.ben-manes.versions' version '0.64.0'
  id 'org.sonarqube' version '7.5.0.8588'
  id 'info.solidsoft.pitest' version '1.19.0'
  id 'io.freefair.lombok' version '9.7.0'
  // If Pact version is changed, make sure serenity report works.
  id 'au.com.dius.pact' version '4.7.5'
  id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
  id 'org.flywaydb.flyway' version '13.8.0'
}

group = 'uk.gov.hmcts.reform'
version = '0.0.1'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

sourceSets {

  testUtils {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/testUtils/java')
    }
    resources.srcDir file('src/testUtils/resources')
  }

  functionalTest {
    java {
      compileClasspath += testUtils.output
      runtimeClasspath += testUtils.output
      srcDir file('src/functionalTest/java')
    }
    resources.srcDir file('src/functionalTest/resources')
  }

  integrationTest {
    java {
      compileClasspath += testUtils.output
      runtimeClasspath += testUtils.output
      srcDir file('src/integrationTest/java')
    }
    resources.srcDir file('src/integrationTest/resources')
  }

  smokeTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/smokeTest/java')
    }
    resources.srcDir file('src/smokeTest/resources')
  }

  contractTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/contractTest/java')
    }
    resources.srcDir file('src/contractTest/resources')
  }

}
tasks.withType(Copy) {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

tasks.withType(Test) {
  useJUnitPlatform()

  testLogging {
    exceptionFormat = 'full'
    showStandardStreams = true
  }
}

test {
  failFast = true
}

task functional(type: Test) {
  maxParallelForks = (System.getenv('MAX_FT_TESTS_PARALLEL_FORKS') ? System.getenv('MAX_FT_TESTS_PARALLEL_FORKS') : 1) as int
  description = "Runs functional tests"
  group = "Verification"
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED']
  // finalizedBy aggregate
}

task integration(type: Test) {
  jvmArgs = ['-Xms512m', '-Xmx2048m']
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  failFast = true
}

build.dependsOn integration

task smoke(type: Test) {
  description = "Runs Smoke Tests"
  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
}

project.ext {
  pacticipant = 'wa_task_management_api'
  pacticipantVersion = getCheckedOutGitCommitHash()
}

checkstyle {
  maxWarnings = 0
  toolVersion = '10.26.1'
  getConfigDirectory().set(new File(rootDir, 'config/checkstyle'))
}

pmd {
  toolVersion = "6.40.0"
  sourceSets = [sourceSets.main]
  reportsDir = file("$project.buildDir/reports/pmd")
  // https://github.com/pmd/pmd/issues/876
  ruleSets = []
  ruleSetFiles = files("config/pmd/ruleset.xml")
}

jacocoTestCoverageVerification {
  violationRules {
    rule {
      excludes = ["com.gargoylesoftware.htmlunit.javascript.host.css.StyleAttributes"]
    }
  }
}

jacocoTestReport {
  dependsOn test, integration
  executionData(test, integration)
  reports {
    xml.required = true
    csv.required = false
    xml.outputLocation = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
  }
}

pitest {
  pitestVersion = '1.25.7'
  junit5PluginVersion = '1.2.3'
  testSourceSets = [sourceSets.test]
  targetClasses = ['uk.gov.hmcts.reform.wataskmanagementapi.*']
  excludedClasses = [
    'uk.gov.hmcts.reform.wataskmanagementapi.taskconfiguration.config.*',
    'uk.gov.hmcts.reform.wataskmanagementapi.config.*',
    'uk.gov.hmcts.reform.wataskmanagementapi.Application'
  ]
  threads = 10
  outputFormats = ['XML', 'HTML']
  timestampedReports = false
  mutationThreshold = 80
}

task tests {
  description = "Runs junit , integration and functional tests"
  dependsOn test, integration, functional
}

project.tasks['pitest'].group = "Verification"

project.tasks['sonarqube'].dependsOn jacocoTestReport


// Ensures that functional tests index page is generated
// Functional tests should run two tasks "functional" and "aggregate"
gradle.startParameter.continueOnFailure = true

sonarqube {
  properties {
    property "sonar.projectName", "Reform :: wa-task-management-api"
    property "sonar.projectKey", "uk.gov.hmcts.reform:wa-task-management-api"
    property "sonar.coverage.jacoco.xmlReportPaths", "${jacocoTestReport.reports.xml.outputLocation}"
    property "sonar.pitest.mode", "reuseReport"
    property "sonar.pitest.reportsDirectory", "build/reports/pitest"
    property "sonar.exclusions", "src/main/java/uk/gov/hmcts/reform/wataskmanagementapi/config/**," +
      "src/main/java/uk/gov/hmcts/reform/wataskmanagementapi/Application.java," +
      "src/testUtils/java/uk/gov/hmcts/reform/wataskmanagementapi/**," +
      "src/main/java/uk/gov/hmcts/reform/wataskmanagementapi/clients/**," +
      "src/main/java/uk/gov/hmcts/reform/wataskmanagementapi/domain/entities/search/parameter/**," +
      "src/main/java/uk/gov/hmcts/reform/wataskmanagementapi/cft/replicarepository/**"
    property "sonar.cpd.exclusions", "src/main/java/uk/gov/hmcts/reform/wataskmanagementapi/services/calendar/**," +
      "src/main/java/uk/gov/hmcts/reform/wataskmanagementapi/controllers/TaskActionsController.java,"
  }
}

// before committing a change, make sure task still works
dependencyUpdates {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }
  rejectVersionIf { selection -> // <---- notice how the closure argument is named
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'

  //CVE Scanning only relevant to production code that is published, not test or other implementations
  scanConfigurations.addAll(['releaseCompileClasspath'])

  analyzers {
    // Disable scanning of .NET related binaries
    assemblyEnabled = false
  }
}

dependencyManagement {
  dependencies {
    dependency group: 'commons-io', name: 'commons-io', version: '2.19.0'

    dependencySet(group: 'org.seleniumhq.selenium', version: '4.2.2') {
      entry 'selenium-java'
      entry 'selenium-remote-driver'
      entry 'selenium-firefox-driver'
      entry 'selenium-chrome-driver'
      entry 'selenium-safari-driver'
      entry 'selenium-edge-driver'
      entry 'selenium-api'
      entry 'selenium-support'
    }

    dependencySet(group: 'ch.qos.logback', version: '1.5.38') {
      entry 'logback-classic'
      entry 'logback-core'
    }
  }
}

def versions = [
  junit         : '6.1.3',
  junitPlatform : '6.1.3',
  reformLogging : '8.0.0',
  springDoc     : '3.1.1',
  serenity      : '5.3.11',
  pitest        : '1.25.7',
  sonarPitest   : '0.5',
  pactVersion   : '4.7.5',
  logbook       : '3.9.0',
  tomcat        : '11.0.26',
  testcontainers: '1.21.4',
  mapStruct     : '1.6.3'
]

ext.libraries = [
  junit5: [
    "org.junit.jupiter:junit-jupiter-api:${versions.junit}",
    "org.junit.jupiter:junit-jupiter-engine:${versions.junit}",
    "org.junit.jupiter:junit-jupiter-params:${versions.junit}",
    "org.junit.platform:junit-platform-commons:${versions.junitPlatform}",
    "org.junit.platform:junit-platform-engine:${versions.junitPlatform}",
    "org.junit.platform:junit-platform-launcher:${versions.junitPlatform}"
  ]
]

ext['snakeyaml.version'] = '2.0'
dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.3"
    mavenBom "org.testcontainers:testcontainers-bom:${versions.testcontainers}"
  }
}

// The additional test source sets use the same Boot 4 test starters and
// support libraries as the standard test source set.
configurations {
  testUtilsImplementation.extendsFrom testImplementation
  testUtilsRuntimeOnly.extendsFrom testRuntimeOnly
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom testRuntimeOnly
  contractTestImplementation.extendsFrom testImplementation
  contractTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
  // Keep Lombok annotation processing active for custom test source sets and test fixtures.
  compileOnly group: 'org.projectlombok', name: 'lombok'
  annotationProcessor group: 'org.projectlombok', name: 'lombok'
  testCompileOnly group: 'org.projectlombok', name: 'lombok'
  testAnnotationProcessor group: 'org.projectlombok', name: 'lombok'

  implementation group: 'org.mapstruct', name: 'mapstruct', version: versions.mapStruct
  implementation group: 'org.mapstruct', name: 'mapstruct-processor', version: versions.mapStruct
  annotationProcessor group: 'org.mapstruct', name: 'mapstruct-processor', version: versions.mapStruct

  testImplementation group: 'org.mapstruct', name: 'mapstruct', version: versions.mapStruct
  testAnnotationProcessor group: 'org.mapstruct', name: 'mapstruct-processor', version: versions.mapStruct


  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webmvc'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-aspectj'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-jackson'
  // Temporary bridge for Zalando Logbook/Problem APIs that still expose Jackson 2 types.
  // MVC, Feign and application DTOs remain owned by Jackson 3.
  implementation group: 'org.springframework.boot', name: 'spring-boot-jackson2'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-flyway'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-cache'

  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation'


  implementation (group: 'org.springframework.boot', name: 'spring-boot-starter-security-oauth2-client') {
    exclude group: 'net.minidev', module: 'json-smart'
  }
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security-oauth2-resource-server'
  implementation group: 'org.springframework.cloud', name: 'spring-cloud-context', version: '5.0.3'

  implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-openfeign', version: '5.0.3'

  implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: versions.springDoc

  implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.5'

  implementation group: 'org.springframework.security', name: 'spring-security-rsa', version: '1.1.5'

  implementation group: 'org.springframework.retry', name: 'spring-retry', version: '2.0.13'

  implementation group: 'org.zalando', name: 'logbook-core', version: versions.logbook
  implementation group: 'org.zalando', name: 'logbook-spring-boot-starter', version: versions.logbook
  implementation group: 'org.zalando', name: 'logbook-httpclient5', version: versions.logbook
  // Use the Problem web API without its Boot 3 auto-configuration. The starter
  // registers a Spring Security 6-era post-processor and fails on Security 7.
  implementation group: 'org.zalando', name: 'problem-spring-web', version: '0.29.1'

  implementation group: 'net.minidev', name: 'json-smart', version: '2.5.2'

  implementation group: 'com.launchdarkly', name: 'launchdarkly-java-server-sdk', version: '7.14.0'
  implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
  implementation group: 'commons-fileupload', name: 'commons-fileupload', version: '1.6.0'
  implementation group: 'commons-beanutils', name: 'commons-beanutils', version: '1.11.0'

  implementation group: 'com.github.hmcts.java-logging', name: 'logging', version: versions.reformLogging

  implementation group: 'org.hibernate.orm', name: 'hibernate-core'
  implementation group: 'org.hibernate.validator', name: 'hibernate-validator'

  implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.26.0'
  implementation group: 'org.apache.logging.log4j', name: 'log4j-to-slf4j', version: '2.26.0'
  implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.18'

  implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-core', version: versions.tomcat
  implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-websocket', version: versions.tomcat

  // 6.1.0 is Java 25-only; 6.0.1 remains compatible with this service's Java 21 toolchain.
  implementation group: 'com.github.hmcts', name: 'service-auth-provider-java-client', version: '6.0.1'
  implementation group: 'com.github.hmcts', name: 'core-case-data-store-client', version: '6.1.0'
  implementation group: 'com.github.hmcts', name: 'idam-java-client', version: '4.0.0'

  implementation group: 'com.auth0', name: 'java-jwt', version: '4.5.2'

  implementation group: 'org.flywaydb', name: 'flyway-core', version: '13.8.0'
  runtimeOnly group: 'org.flywaydb', name: 'flyway-database-postgresql', version: '13.8.0'

  implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.11'

